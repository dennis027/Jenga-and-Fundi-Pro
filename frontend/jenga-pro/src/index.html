  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..600,0..1,0&icon_names=add,add_business,add_photo_alternate,add_task,apartment,arrow_back,arrow_forward,badge,block,bookmark,calendar_month,call,campaign,category,celebration,check,check_circle,chevron_right,close,construction,dark_mode,delete,done,done_all,download,edit,engineering,error,error_outline,expand_more,face,fact_check,filter_list,flag,flip,front_hand,gavel,group_off,groups,handyman,health_and_safety,help,history,hourglass_empty,hourglass_top,image,info,install_mobile,keyboard_double_arrow_left,keyboard_double_arrow_right,light_mode,location_off,location_on,lock,logout,mail,mark_email_read,menu,military_tech,monitoring,more_horiz,notifications,pause_circle,payments,pending_actions,percent,person,person_off,person_search,personal_injury,photo_camera,photo_library,play_circle,priority_high,radio_button_unchecked,receipt_long,refresh,report,request_quote,save,savings,schedule,search,select_all,send,send_to_mobile,share,smartphone,sms,space_dashboard,star,task_alt,timeline,translate,travel_explore,tune,upload,verified,verified_user,visibility,visibility_off,warning,work,work_history,work_off,workspace_premium&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <script>
    /* apply the saved / system theme before first paint (no white flash) */
    try {
      var m = localStorage.getItem('theme') || 'system';
      var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    } catch (e) {}
    /* reveal icons once the icon font is ready, so ligature names never flash */
    (function () {
      var done = function () { document.documentElement.classList.add('icons-ready'); };
      try { document.fonts.load('24px "Material Symbols Outlined"').then(done, done); } catch (e) { done(); }
      setTimeout(done, 4000);
    })();
  </script>

  <app-root></app-root>
</body>
